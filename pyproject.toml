[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-game"
version = "0.1.0"
description = "Legion, a 16-bit inspired open-world RPG built with pygame."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
legion = "legion.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
